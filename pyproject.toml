[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "ppieval"
version = "0.1.0"
description = "Estimate a human-judged quantity from a few human labels plus an automatic judge's scores, with a confidence interval that stays valid when the judge is biased."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Vipul Raj Jha" }]
keywords = [
    "evaluation",
    "prediction-powered inference",
    "confidence intervals",
    "llm judge",
    "statistics",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Mathematics",
]
dependencies = ["numpy>=1.23"]

[project.optional-dependencies]
dev = ["pytest>=7", "pytest-cov>=4", "ruff>=0.4", "scipy>=1.10"]
reference = ["ppi-python>=0.2"]

[project.scripts]
ppieval = "ppieval.cli:main"

[project.urls]
Homepage = "https://github.com/vipul21435/ppieval"

[tool.hatch.build.targets.wheel]
packages = ["src/ppieval"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
line-length = 100
target-version = "py310"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF"]

[tool.coverage.run]
source = ["ppieval"]
branch = true

[tool.coverage.report]
show_missing = true
